name: Tagesbild

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC, täglich
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  zeichnen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # die ganze Kette, nicht nur der letzte Commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bild zeichnen
        run: python generate.py --repo "$GITHUB_REPOSITORY"

      - name: Wand legen
        run: python3 wall.py --format a2

      - name: Commit und Push
        run: |
          git config user.name "Eigenlicht"
          git config user.email "eigenlicht@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Heute gibt es schon ein Bild — nichts zu tun."
            exit 0
          fi
          git commit -m "Bild $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push

  seite:
    needs: zeichnen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # WICHTIG: ohne ref nimmt checkout den SHA, der den Lauf gestartet hat --
      # also den Stand VOR dem Commit von "zeichnen". Die Seite wäre dann immer
      # ein Bild hinterher (Bild im Repo, auf der Seite 404).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5

      - name: Nur die Seite einpacken
        run: |
          mkdir -p _site
          cp index.html wand.svg _site/
          cp -r art _site/art
          rm -f _site/art/INDEX.md
          # Sicherung: nie eine veraltete Seite veroeffentlichen.
          newest=$(grep -o 'art/[0-9-]*\.svg' index.html | head -1)
          test -n "$newest" || { echo "::error::index.html nennt kein Bild"; exit 1; }
          test -f "_site/$newest" || { echo "::error::$newest fehlt im Paket"; exit 1; }
          echo "Paket enthaelt $newest"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
